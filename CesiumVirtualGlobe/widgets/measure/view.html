<!DOCTYPE html>
<html class="no-js css-menubar" lang="en">

<head>
    <title>Popup Sub-page</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <!-- Mobile device viewport -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,minimal-ui">
    <meta name="author" content="Mars Technology http://cesium.marsgis.cn ">
    <!-- Set 360 browser to use Webkit engine -->
    <meta name="renderer" content="webkit">
    <!-- Add desktop shortcut for Chrome browser (Android) -->
    <link rel="icon" type="image/png" href="../../img/favicon/favicon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Add to home screen for Safari browser (iOS) -->
    <link rel="icon" sizes="192x192" href="img/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Mars GIS">
    <!-- Windows 8 title bar and icon -->
    <link rel="apple-touch-icon-precomposed" href="../../img/favicon/apple-touch-icon.png">
    <meta name="msapplication-TileImage" content="../../img/favicon/app-icon72x72@2x.png">
    <meta name="msapplication-TileColor" content="#62a8ea">

    <!-- Third-party library imports -->
    <script type="text/javascript" src="../../lib/include-lib.js?time=20190418" libpath="../../lib/"
            include="jquery,font-awesome,bootstrap,admui-frame"></script>

    <link href="../../css/widget-win.css" rel="stylesheet" />
</head>


<body style="padding:5px;text-align:center;" title="Tip: Click button to activate corresponding feature. Click on map to start, click to add points during drawing, double-click to end.">
    <div class="btn-group" role="group">
  
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Distance
                <span class="caret"></span>
            </button>
            <ul class="dropdown-menu">
                <li id="btn_measure_length"><a href="javascript:void(0)">3D Distance</a></li>
                <li id="btn_measure_length_td"><a href="javascript:void(0)">Ground Distance</a></li>
            </ul>
        </div>

        <button id="btn_measure_section" type="button" class="btn btn-primary">
            Cross-section
        </button>

        <button id="btn_measure_area" type="button" class="btn btn-primary">
            Area
        </button>

        <button id="btn_measure_angle" type="button" class="btn btn-primary">
            Angle
        </button>

        <div class="btn-group" role="group">
            <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Elevation
                <span class="caret"></span>
            </button>
            <ul class="dropdown-menu">
                <li id="btn_measure_height"><a href="javascript:void(0)">Height Difference</a></li>
                <li id="btn_measure_supHeight"><a href="javascript:void(0)">Triangulation</a></li>
            </ul>
        </div>

        <button id="btn_measure_clear" type="button" class="btn btn-danger">
            Clear
        </button>
    </div>


    <div id="measure_danwei" style="margin-top:5px;">
        <span style="font-size: 16px;padding-right:10px">Unit</span>
        <select id="measure_length_danwei" class="form-control" style="width:140px">
            <option value="auto">Auto</option>
            <option value="m">Meters</option>
            <option value="km">Kilometers</option>
            <option value="mile">Nautical Miles</option>
            <option value="zhang">Zhang</option>
        </select>
        <select id="measure_area_danwei" class="form-control" style="width:140px;display:none;">
            <option value="auto">Auto</option>
            <option value="m">Square Meters</option>
            <option value="km">Square Kilometers</option>
            <option value="mu">Mu</option>
            <option value="ha">Hectares</option>
        </select>
    </div>

    <div style="margin-top:5px;">
        <span id="lbl_measure_result" style="font-size: 16px;"></span>
    </div>

    <!-- Page JavaScript -->
    <script src="view.js?time=20190418"></script>
</body>
</html>
